name: Super 6 Reminder Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  reminders:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find next Super 6 deadline
        shell: bash
        env:
          NTFY_TOPIC: s6r-7k29x-p4m83-q91fz

        run: |

          set -e

          mkdir -p .super6

          STATE=".super6/reminders.json"

          if [ ! -f "$STATE" ]; then
            echo '{}' > "$STATE"
          fi


          echo "Downloading Super 6 page..."

          curl -L -sS \
            -A "Mozilla/5.0" \
            "https://super6.skysports.com/" \
            -o /tmp/super6.html


          echo "Searching for Super 6 deadline..."


          python3 <<'PY'

          import re
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo


          html = open(
              "/tmp/super6.html",
              encoding="utf-8",
              errors="ignore"
          ).read()


          # Convert HTML into readable text.

          text = re.sub(
              r"<script.*?</script>",
              " ",
              html,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<style.*?</style>",
              " ",
              text,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<[^>]+>",
              " ",
              text
          )

          text = re.sub(
              r"\s+",
              " ",
              text
          )


          print("Page text:")
          print(text[:3000])


          # Look for:
          #
          # Round 2 - Deadline 29th Aug @ 2:00pm
          #
          # and similar formats.


          patterns = [

              r"Round\s+(\d+).*?"
              r"Deadline\s+(\d{1,2})(?:st|nd|rd|th)?\s+"
              r"([A-Za-z]+)\s*@\s*"
              r"(\d{1,2}):(\d{2})\s*(am|pm)?",

              r"Round\s+(\d+).*?"
              r"Deadline\s+(\d{1,2})(?:st|nd|rd|th)?\s+"
              r"([A-Za-z]+)\s*@\s*"
              r"(\d{1,2})\s*(am|pm)",

              r"Deadline\s+(\d{1,2})(?:st|nd|rd|th)?\s+"
              r"([A-Za-z]+)\s*@\s*"
              r"(\d{1,2}):(\d{2})\s*(am|pm)?",

              r"Deadline\s+(\d{1,2})(?:st|nd|rd|th)?\s+"
              r"([A-Za-z]+)\s*@\s*"
              r"(\d{1,2})\s*(am|pm)"
          ]


          months = {

              "january": 1,
              "february": 2,
              "march": 3,
              "april": 4,
              "may": 5,
              "june": 6,
              "july": 7,
              "august": 8,
              "september": 9,
              "october": 10,
              "november": 11,
              "december": 12

          }


          now = datetime.now(
              ZoneInfo("Europe/London")
          )


          found = None


          for pattern in patterns:

              match = re.search(
                  pattern,
                  text,
                  re.I
              )

              if not match:
                  continue


              groups = match.groups()


              if len(groups) == 6:

                  round_number = groups[0]

                  day = int(groups[1])

                  month_name = groups[2]

                  hour = int(groups[3])

                  minute = int(groups[4])

                  ampm = groups[5]

              else:

                  round_number = "unknown"

                  day = int(groups[0])

                  month_name = groups[1]

                  hour = int(groups[2])

                  minute = 0

                  ampm = groups[3]


              month = months.get(
                  month_name.lower()
              )


              if not month:
                  continue


              if ampm:

                  if (
                      ampm.lower() == "pm"
                      and hour != 12
                  ):
                      hour += 12

                  if (
                      ampm.lower() == "am"
                      and hour == 12
                  ):
                      hour = 0


              try:

                  candidate = datetime(
                      now.year,
                      month,
                      day,
                      hour,
                      minute,
                      tzinfo=ZoneInfo(
                          "Europe/London"
                      )
                  )

              except ValueError:

                  continue


              # If this date has already passed,
              # try next year.

              if candidate < now:

                  candidate = datetime(
                      now.year + 1,
                      month,
                      day,
                      hour,
                      minute,
                      tzinfo=ZoneInfo(
                          "Europe/London"
                      )
                  )


              found = (
                  str(round_number),
                  candidate.isoformat()
              )

              break


          if not found:

              print(
                  "ERROR: Could not find a Super 6 deadline."
              )

              sys.exit(1)


          round_number, deadline = found


          print(
              "Found Round:",
              round_number
          )

          print(
              "Found deadline:",
              deadline
          )


          with open(
              ".super6/current.txt",
              "w"
          ) as f:

              f.write(
                  round_number
                  + "|"
                  + deadline
              )

          PY


          IFS='|' read ROUND DEADLINE \
            < .super6/current.txt


          echo "Round: $ROUND"
          echo "Deadline: $DEADLINE"


          python3 <<'PY'

          import json
          import os
          import subprocess

          from datetime import (
              datetime,
              timedelta
          )

          from zoneinfo import ZoneInfo


          state_file = \
              ".super6/reminders.json"


          with open(
              ".super6/current.txt"
          ) as f:

              round_number, deadline_text = \
                  f.read().strip().split(
                      "|",
                      1
                  )


          deadline = \
              datetime.fromisoformat(
                  deadline_text
              )


          now = datetime.now(
              ZoneInfo("Europe/London")
          )


          offsets = {

              "72h":
                  timedelta(hours=72),

              "24h":
                  timedelta(hours=24),

              "3h":
                  timedelta(hours=3)

          }


          state = {}


          if os.path.exists(state_file):

              try:

                  with open(state_file) as f:

                      state = json.load(f)

              except Exception:

                  state = {}


          key = (
              f"round-{round_number}-"
              f"{deadline.isoformat()}"
          )


          if key not in state:

              state[key] = {}


          for label, offset in offsets.items():

              target = deadline - offset


              if (
                  now >= target
                  and now < deadline
              ):


                  if state[key].get(label):

                      print(
                          label,
                          "already sent."
                      )

                      continue


                  hours_late = (
                      now - target
                  ).total_seconds() / 3600


                  if hours_late > 6:

                      print(
                          label,
                          "missed by more than 6 hours."
                      )

                      state[key][label] = \
                          "missed"

                      continue


                  if label == "72h":

                      title = \
                          "⚽ Super 6 — 72 hour reminder"

                  elif label == "24h":

                      title = \
                          "⚽ Super 6 — 24 hour reminder"

                  else:

                      title = \
                          "🚨 Super 6 — 3 hour warning"


                  message = (

                      f"Round {round_number}: "
                      f"don't forget your Super 6 "
                      f"predictions! "

                      f"Deadline: "
                      f"{deadline.strftime('%A %d %B at %H:%M')}."

                  )


                  print(
                      "Sending",
                      label,
                      "notification..."
                  )


                  result = subprocess.run(

                      [
                          "curl",
                          "-sS",
                          "-X",
                          "POST",

                          "-H",
                          f"Title: {title}",

                          "-H",
                          (
                              "Priority: 5"
                              if label == "3h"
                              else "Priority: 4"
                          ),

                          "-H",
                          "Tags: soccer,warning",

                          "-H",
                          (
                              "Click: "
                              "https://jonauk.github.io/"
                              "Super-six/"
                          ),

                          "-d",
                          message,

                          "https://ntfy.sh/"
                          + os.environ[
                              "NTFY_TOPIC"
                          ]

                      ],

                      capture_output=True,
                      text=True
                  )


                  if result.returncode != 0:

                      raise SystemExit(
                          "ntfy notification failed: "
                          + result.stderr
                      )


                  print(
                      result.stdout
                  )


                  state[key][label] = \
                      now.isoformat()


          # Keep the state file small.

          if len(state) > 20:

              keys = list(
                  state.keys()
              )

              for old_key in keys[:-20]:

                  del state[old_key]


          with open(
              state_file,
              "w"
          ) as f:

              json.dump(
                  state,
                  f,
                  indent=2
              )

          PY


      - name: Save reminder state
        shell: bash

        run: |

          git config \
            user.name \
            "Super 6 Reminder"

          git config \
            user.email \
            "super6-reminder@users.noreply.github.com"


          git add \
            .super6/reminders.json


          if git diff --cached --quiet; then

            echo \
              "No reminder state changes."

          else

            git commit \
              -m \
              "Update Super 6 reminder state"

            git push

          fi
