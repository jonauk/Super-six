name: Super 6 Reminder Scheduler

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification now"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  reminders:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # TEST NOTIFICATION
      # ============================================================

      - name: Send test notification
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: s6r-7k29x-p4m83-q91fz
        run: |
          set -e

          curl -fsS \
            -X POST \
            -H "Title: Super 6 Reminder - TEST" \
            -H "Priority: 5" \
            -H "Tags: soccer,bell,test" \
            -H "Click: https://jonauk.github.io/Super-six/" \
            --data-raw "TEST SUCCESS! Your Super 6 reminder system is working and can reach your Android phone." \
            "https://ntfy.sh/${NTFY_TOPIC}"

          echo "Test notification sent successfully."

      # ============================================================
      # REAL SUPER 6 REMINDERS
      # ============================================================

      - name: Check Super 6 deadlines
        if: ${{ inputs.test_notification != true }}
        env:
          NTFY_TOPIC: s6r-7k29x-p4m83-q91fz
        run: |

          set -e

          mkdir -p .super6

          python3 <<'PY'

          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          # ==========================================================
          # SUPER 6 SCHEDULE
          #
          # Times are UK local times.
          #
          # Sky confirms that each Round closes when the first
          # fixture in that Round kicks off.
          #
          # Round 2 is taken from Sky's current live Super 6 page:
          # 29 August 2026 at 2:00pm.
          #
          # The remaining published Round schedule follows Sky's
          # current 2026/27 terms.
          # ==========================================================

          deadlines = [

              ("Round 2",  "2026-08-29 14:00"),
              ("Round 3",  "2026-09-05 14:00"),
              ("Round 4",  "2026-09-08 19:00"),
              ("Round 5",  "2026-09-12 14:00"),
              ("Round 6",  "2026-09-15 18:30"),
              ("Round 7",  "2026-09-19 14:00"),

              ("Round 8",  "2026-10-10 14:00"),
              ("Round 9",  "2026-10-13 19:00"),
              ("Round 10", "2026-10-17 14:00"),
              ("Round 11", "2026-10-20 19:00"),
              ("Round 12", "2026-10-24 14:00"),
              ("Round 13", "2026-10-27 18:30"),
              ("Round 14", "2026-10-31 14:00"),

              ("Round 15", "2026-11-03 20:00"),
              ("Round 16", "2026-11-07 15:00"),
              ("Round 17", "2026-11-21 15:00"),
              ("Round 18", "2026-11-24 20:00"),
              ("Round 19", "2026-11-28 15:00"),
          ]

          LONDON = ZoneInfo("Europe/London")

          now = datetime.now(LONDON)

          print("========================================")
          print("SUPER 6 REMINDER SCHEDULER")
          print("========================================")
          print("Current UK time:")
          print(now.strftime("%A %d %B %Y %H:%M:%S %Z"))
          print("")

          # ==========================================================
          # FIND NEXT ROUND
          # ==========================================================

          upcoming = []

          for round_name, date_text in deadlines:

              local_time = datetime.strptime(
                  date_text,
                  "%Y-%m-%d %H:%M"
              ).replace(
                  tzinfo=LONDON
              )

              if local_time > now:
                  upcoming.append(
                      (round_name, local_time)
                  )

          if not upcoming:
              print("There are no upcoming configured Super 6 rounds.")
              raise SystemExit(0)

          round_name, deadline = min(
              upcoming,
              key=lambda item: item[1]
          )

          print("Next Super 6 round:", round_name)
          print(
              "Deadline:",
              deadline.strftime(
                  "%A %d %B %Y at %H:%M"
              )
          )
          print("")

          # ==========================================================
          # LOAD STATE
          # ==========================================================

          state_file = ".super6/state.json"

          try:
              with open(state_file, "r") as f:
                  state = json.load(f)
          except Exception:
              state = {}

          round_key = (
              round_name
              + "|"
              + deadline.isoformat()
          )

          if round_key not in state:
              state[round_key] = {}

          # ==========================================================
          # REMINDER SCHEDULE
          # ==========================================================

          reminders = [

              (
                  "72h",
                  timedelta(hours=72),
                  "Super 6 - 72 hour reminder",
                  "4"
              ),

              (
                  "24h",
                  timedelta(hours=24),
                  "Super 6 - 24 hour reminder",
                  "4"
              ),

              (
                  "3h",
                  timedelta(hours=3),
                  "Super 6 - 3 hour warning",
                  "5"
              ),

              (
                  "30m",
                  timedelta(minutes=30),
                  "Super 6 - 30 minute warning",
                  "5"
              )
          ]

          # ==========================================================
          # PROCESS REMINDERS
          # ==========================================================

          for code, offset, title, priority in reminders:

              target = deadline - offset

              print(
                  f"{code} reminder target: "
                  f"{target.strftime('%A %d %B %H:%M')}"
              )

              # Not time yet
              if now < target:
                  continue

              # Deadline already passed
              if now >= deadline:
                  continue

              # Already sent
              if code in state[round_key]:
                  print(
                      f"{code}: already processed"
                  )
                  continue

              # GitHub runs every 15 minutes.
              # Allow up to 45 minutes for a delayed run.
              lateness = now - target

              if lateness > timedelta(minutes=45):

                  print(
                      f"{code}: reminder missed"
                  )

                  state[round_key][code] = "missed"

                  continue

              # ======================================================
              # BUILD NOTIFICATION
              # ======================================================

              deadline_text = deadline.strftime(
                  "%A %d %B at %H:%M"
              )

              message = (
                  f"{round_name}\n\n"
                  "Don't forget to put your Super 6 predictions on!\n\n"
                  f"Deadline: {deadline_text}\n\n"
                  "Tap this notification to open Super 6."
              )

              print(
                  f"Sending {code} notification..."
              )

              result = subprocess.run(
                  [
                      "curl",
                      "-fsS",
                      "-X",
                      "POST",

                      "-H",
                      f"Title: {title}",

                      "-H",
                      f"Priority: {priority}",

                      "-H",
                      "Tags: soccer,bell,warning",

                      "-H",
                      "Click: https://jonauk.github.io/Super-six/",

                      "--data-raw",
                      message,

                      f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:

                  print(
                      "Notification error:"
                  )

                  print(
                      result.stderr
                  )

                  raise SystemExit(
                      "Failed to send ntfy notification."
                  )

              print(
                  f"{code}: notification sent successfully."
              )

              state[round_key][code] = now.isoformat()

          # ==========================================================
          # KEEP STATE FILE SMALL
          # ==========================================================

          if len(state) > 30:

              keys = list(state.keys())

              for old_key in keys[:-30]:
                  del state[old_key]

          with open(state_file, "w") as f:

              json.dump(
                  state,
                  f,
                  indent=2
              )

          print("")
          print("Scheduler completed successfully.")

          PY

      # ============================================================
      # SAVE REMINDER STATE
      # ============================================================

      - name: Save reminder state
        if: ${{ inputs.test_notification != true }}
        run: |

          git config user.name "Super 6 Reminder"
          git config user.email "super6-reminder@users.noreply.github.com"

          git add .super6/state.json

          if git diff --cached --quiet; then

              echo "No reminder state changes."

          else

              git commit \
                -m "Update Super 6 reminder state"

              git push

          fi
