
                      

              elif label == "24h":
                  title = (
                      "⚽ Super 6 — 24 hour reminder"
                  )

              else:
                  title = (
                      "🚨 Super 6 — 3 hour warning"
                  )

              message = (
                  f"Round {round_number}: "
                  f"don't forget your Super 6 predictions! "
                  f"Deadline: "
                  f"{deadline.strftime('%A %d %B at %H:%M')}."
              )

              print(
                  f"Sending {label} notification..."
              )

              result = subprocess.run(
                  [
                      "curl",
                      "-f",
                      "-sS",
                      "-X",
                      "POST",
                      "-H",
                      f"Title: {title}",
                      "-H",
                      (
                          "Priority: 5"
                          if label == "3h"
                          else "Priority: 4"
                      ),
                      "-H",
                      "Tags: soccer,warning",
                      "-H",
                      (
                          "Click: "
                          "https://jonauk.github.io/"
                          "Super-six/"
                      ),
                      "-d",
                      message,
                      (
                          "https://ntfy.sh/"
                          + os.environ["NTFY_TOPIC"]
                      ),
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.returncode != 0:
                  raise SystemExit(
                      "ntfy notification failed: "
                      + result.stderr
                  )

              print(
                  "ntfy response:",
                  result.stdout
              )

              state[key][label] = (
                  now.isoformat()
              )

          # Keep only the latest 20 rounds.
          if len(state) > 20:

              keys = list(state.keys())

              for old_key in keys[:-20]:
                  del state[old_key]

          with open(state_file, "w") as f:
              json.dump(
                  state,
                  f,
                  indent=2
              )

          print("Reminder state saved.")
          PY

      - name: Save reminder state
        shell: bash
        run: |
          git config user.name "Super 6 Reminder"
          git config user.email "super6-reminder@users.noreply.github.com"

          git add .super6/reminders.json

          if git diff --cached --quiet; then
            echo "No reminder state changes."
          else
            git commit -m "Update Super 6 reminder state"
            git push
          fi
          
