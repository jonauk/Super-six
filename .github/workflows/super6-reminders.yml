name: Super 6 Reminder Scheduler

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification now"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find next Super 6 deadline
        run: |
          mkdir -p .super6

          python3 <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/London"))

          rounds = [
              (3, "2026-09-05T15:00:00+01:00"),
              (4, "2026-09-08T20:00:00+01:00"),
              (5, "2026-09-12T15:00:00+01:00"),
              (6, "2026-09-15T19:30:00+01:00"),
              (7, "2026-09-19T15:00:00+01:00"),
              (8, "2026-10-10T15:00:00+01:00"),
              (9, "2026-10-13T20:00:00+01:00"),
              (10, "2026-10-17T15:00:00+01:00"),
              (11, "2026-10-20T20:00:00+01:00"),
              (12, "2026-10-24T15:00:00+01:00"),
              (13, "2026-10-27T19:30:00+01:00"),
              (14, "2026-10-31T15:00:00+00:00"),
              (15, "2026-11-03T20:00:00+00:00"),
              (16, "2026-11-07T15:00:00+00:00"),
              (17, "2026-11-21T15:00:00+00:00"),
              (18, "2026-11-24T20:00:00+00:00"),
              (19, "2026-11-28T15:00:00+00:00")
          ]

          for number, value in rounds:
              deadline = datetime.fromisoformat(value)

              if deadline > now:
                  with open(".super6/current.json", "w") as f:
                      json.dump(
                          {
                              "round": number,
                              "deadline": value
                          },
                          f
                      )

                  print(f"Next round: {number}")
                  print(f"Deadline: {value}")
                  break
          else:
              raise SystemExit("No future Super 6 round found.")
          PY

      - name: Send one-hour reminder
        env:
          NTFY_TOPIC: s6r-7k29x-p4m83-q91fz
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          with open(".super6/current.json") as f:
              data = json.load(f)

          round_number = data["round"]
          deadline = datetime.fromisoformat(data["deadline"])
          now = datetime.now(ZoneInfo("Europe/London"))

          state_file = ".super6/reminders.json"

          try:
              with open(state_file) as f:
                  state = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}

          key = f"round-{round_number}-{deadline.isoformat()}"
          state.setdefault(key, {})

          def send(title, message):
              result = subprocess.run(
                  [
                      "curl",
                      "-f",
                      "-sS",
                      "-X",
                      "POST",
                      "-H",
                      f"Title: {title}",
                      "-H",
                      "Priority: 5",
                      "-H",
                      "Tags: soccer,warning",
                      "-H",
                      "Click: https://jonauk.github.io/Super-six/",
                      "-d",
                      message,
                      f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  raise SystemExit(result.stderr)

              print("NOTIFICATION SENT")

          if os.environ.get("TEST_NOTIFICATION") == "true":
              send(
                  "⚽ Super 6 Reminder Test",
                  "Super 6 reminder notifications are working!"
              )

          target = deadline - timedelta(hours=1)

          print("Current time:", now)
          print("Reminder target:", target)
          print("Deadline:", deadline)

          if target <= now < deadline and not state[key].get("1h"):
              send(
                  "⚽ Super 6 — 1 hour reminder",
                  f"Round {round_number}: don't forget your Super 6 predictions! "
                  f"Deadline: {deadline.strftime('%A %d %B at %H:%M')}."
              )

              state[key]["1h"] = now.isoformat()

          else:
              print("No one-hour reminder due.")

          with open(state_file, "w") as f:
              json.dump(state, f, indent=2)
          PY

      - name: Save reminder state
        run: |
          git config user.name "Super 6 Reminder"
          git config user.email "super6-reminder@users.noreply.github.com"

          git add .super6/reminders.json

          if git diff --cached --quiet; then
            echo "No reminder state changes."
          else
            git commit -m "Update Super 6 reminder state"
            git push
          fi
          
