              text,
              flags=re.I | re.S
          )

          text = re.sub(
              r"<style.*?</style>",
              " ",
              text,
              flags=re.I | re.S
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          patterns = [
              r"Round\s+(\d+).*?Deadline\s+(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\s*@\s*(\d{1,2}):(\d{2})\s*(am|pm)?",
              r"Deadline\s+(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\s*@\s*(\d{1,2}):(\d{2})\s*(am|pm)?"
          ]

          found = None

          for pattern in patterns:
              match = re.search(pattern, text, re.I)

              if match:
                  groups = match.groups()

                  if len(groups) == 6:
                      round_number = groups[0]
                      day = int(groups[1])
                      month_name = groups[2]
                      hour = int(groups[3])
                      minute = int(groups[4])
                      ampm = groups[5]
                  else:
                      round_number = "unknown"
                      day = int(groups[0])
                      month_name = groups[1]
                      hour = int(groups[2])
                      minute = int(groups[3])
                      ampm = groups[4]

                  months = {
                      "january": 1,
                      "february": 2,
                      "march": 3,
                      "april": 4,
                      "may": 5,
                      "june": 6,
                      "july": 7,
                      "august": 8,
                      "september": 9,
                      "october": 10,
                      "november": 11,
                      "december": 12
                  }

                  month = months.get(month_name.lower())

                  if not month:
                      raise SystemExit(
                          "ERROR: Unknown month: "
                          + month_name
                      )

                  if ampm:
                      if ampm.lower() == "pm" and hour != 12:
                          hour += 12

                      if ampm.lower() == "am" and hour == 12:
                          hour = 0

                  london = ZoneInfo("Europe/London")
                  now = datetime.now(london)

                  candidate = datetime(
                      now.year,
                      month,
                      day,
                      hour,
                      minute,
                      tzinfo=london
                  )

                  if candidate.timestamp() < now.timestamp() - 43200:
                      candidate = candidate.replace(
                          year=now.year + 1
                      )

                  found = (
                      str(round_number),
                      candidate.isoformat()
                  )

                  break

          if not found:
              raise SystemExit(
                  "ERROR: Could not find the current Super 6 deadline."
              )

          round_number, deadline = found

          open(".super6/current.txt", "w").write(
              round_number + "|" + deadline
          )

          print("Round:", round_number)
          print("Deadline:", deadline)
          PY

          IFS='|' read ROUND DEADLINE < .super6/current.txt

          echo "Round: $ROUND"
          echo "Deadline: $DEADLINE"

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          state_file = ".super6/reminders.json"

          with open(".super6/current.txt") as f:
              round_number, deadline_text = (
                  f.read().strip().split("|", 1)
              )

          deadline = datetime.fromisoformat(deadline_text)

          now = datetime.now(
              ZoneInfo("Europe/London")
          )

          offsets = {
              "72h": timedelta(hours=72),
              "24h": timedelta(hours=24),
              "3h": timedelta(hours=3)
          }

          state = {}

          if os.path.exists(state_file):
              try:
                  with open(state_file) as f:
                      state = json.load(f)
              except Exception:
                  state = {}

          key = (
              f"round-{round_number}-"
              f"{deadline.isoformat()}"
          )

          if key not in state:
              state[key] = {}

          for label, offset in offsets.items():

              target = deadline - offset

              if now >= target and now < deadline:

                  if state[key].get(label):
                      print(label, "already sent.")
                      continue

                  hours_late = (
                      now - target
                  ).total_seconds() / 3600

                  if hours_late > 6:
                      print(
                          label,
                          "was missed by more than 6 hours."
                      )

                      state[key][label] = "missed"
                      continue

                  if label == "72h":
                      title = (
                          "⚽ Super 6 — "
                          "72 hour reminder"
                      )
                      priority = "4"

                  elif label == "24h":
                      title = (
                          "⚽ Super 6 — "
                          "24 hour reminder"
                      )
                      priority = "4"

                  else:
                      title = (
                          "🚨 Super 6 — "
                          "3 hour warning"
                      )
                      priority = "5"

                  message = (
                      f"Round {round_number}: "
                      f"don't forget your Super 6 "
                      f"predictions! Deadline: "
                      f"{deadline.strftime('%A %d %B at %H:%M')}."
                  )

                  print(
                      "Sending",
                      label,
                      "notification..."
                  )

                  result = subprocess.run(
                      [
                          "curl",
                          "-sS",
                          "-X",
                          "POST",
                          "-H",
                          f"Title: {title}",
                          "-H",
                          f"Priority: {priority}",
                          "-H",
                          "Tags: soccer,warning",
                          "-H",
                          "Click: https://jonauk.github.io/Super-six/",
                          "-d",
                          message,
                          "https://ntfy.sh/"
                          + os.environ["NTFY_TOPIC"]
                      ],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode != 0:
                      raise SystemExit(
                          "ntfy notification failed: "
                          + result.stderr
                      )

                  print(result.stdout)

                  state[key][label] = now.isoformat()

          if len(state) > 20:
              keys = list(state.keys())

              for old_key in keys[:-20]:
                  del state[old_key]

          with open(state_file, "w") as f:
              json.dump(
                  state,
                  f,
                  indent=2
              )

          PY

      - name: Save reminder state
        if: ${{ inputs.test_notification != true }}
        shell: bash
        run: |
          git config user.name "Super 6 Reminder"
          git config user.email "super6-reminder@users.noreply.github.com"

          git add .super6/reminders.json

          if git diff --cached --quiet; then
            echo "No reminder state changes."
          else
            git commit -m "Update Super 6 reminder state"
            git push
          fi
